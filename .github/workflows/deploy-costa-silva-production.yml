name: Deploy Costa & Silva — Production

on:
  push:
    tags:
      - "costa-silva@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ex: costa-silva@v1.0.0)"
        required: true

concurrency:
  group: costa-silva-production
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authority-engine/projects/costa-silva-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  deploy:
    name: Deploy to Cloudflare Pages (production)
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authority-engine/projects/costa-silva-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SITE_URL: https://www.costaesilva.com.br
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          VITE_WHATSAPP_MESSAGE: "Olá, gostaria de falar com um especialista em vistos americanos."
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=costa-silva-site --branch=main
